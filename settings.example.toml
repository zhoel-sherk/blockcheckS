# blockcheckS user configuration (~/.config/blockcheckS/config.toml)
# Copy to: ~/.config/blockcheckS/config.toml
#
# Priority:
#   [paths]  CLI args > this file > XDG / BLOCKCHECKS_*_HOME defaults
#   [tools]  CLI / env BLOCKCHECKS_* > this file > built-in defaults
# Note: BLOCKCHECKS_STATE_HOME only relocates STATE_DIR defaults; it does not
# override an explicit paths.db / paths.out_dir in this file.

[paths]
db = "~/.local/state/blockcheckS/state.db"
out_dir = "~/.local/share/blockcheckS/export"
# First-run: copy ./state.db → XDG db when XDG db is missing (default on)
migrate = true

[run]
parallel = 4
scan_level = "fast"
# Probe wall timeout (s). Lower on a throttled ISP to fail FAST paths quicker.
# PASS answers arrive <125ms, so 1s is safe for the first pass.
timeout = 1.0
# Lua-bridge batch size. Smaller = more netns parallelism (default 500).
bridge_batch = 10
# Domain isolation: N parallel netns always probe N distinct domains
# (no all-youtube false positives). Default true.
domain_isolate = true
# Retry-on-next-IP budget after first failed IP (classic path), seconds.
retry_ip_timeout = 1.0
# AQ ε-greedy exploration.
# adaptive_epsilon = 0.1
# max = 0
#
# Raspberry Pi 2 / ~1 GiB RAM (prebuild linux-arm nfqws2 elsewhere):
# parallel = 1
# scan_level = "fast"
# Also: --curl-parallel 1, --preset pi2, -M timeout-benchmark, --max 20
# Env: BLOCKCHECKS_POOL=1  (now wired into --parallel default)

[tools]
nfqws2 = "/opt/zapret2/nfq2/nfqws2"
blobs = "/opt/zapret2/blobs"
# lua_dir = "/opt/zapret2/lua"
# python = "/path/to/.venv/bin/python"
# Proxy is OPTIONAL — by default probes go DIRECT (the standard: the strategy
# must get a legitimate answer from the server). Set a SOCKS5 proxy only when
# you need egress via it (e.g. googlevideo on a DPI that drops direct):
# proxy = "socks5://127.0.0.1:11080"

[secure_dns]
enabled = true
# Preferred DoH when it answers. Rotation still walks `servers` below.
doh_server = "https://cloudflare-dns.com/dns-query"

# Full catalog (no cap — add as many as you need). `ip` is CURLOPT_RESOLVE
# bootstrap so hijacked UDP cannot poison the resolver hostname.
# trusted = false → shown in the audit table, ignored for verdict / cache / pin.
servers = [
  { name = "Cloudflare", url = "https://cloudflare-dns.com/dns-query", ip = "1.1.1.1", trusted = true },
  { name = "Google", url = "https://dns.google/dns-query", ip = "8.8.8.8", trusted = true },
  { name = "Quad9", url = "https://dns.quad9.net/dns-query", ip = "9.9.9.9", trusted = true },
  { name = "AdGuard", url = "https://dns.adguard-dns.com/dns-query", ip = "94.140.14.14", trusted = true },
  { name = "Yandex", url = "https://dns.yandex.ru/dns-query", ip = "77.88.8.8", trusted = false },
]

udp = [
  { name = "Google", ip = "8.8.8.8" },
  { name = "Cloudflare", ip = "1.1.1.1" },
  { name = "Quad9", ip = "9.9.9.9" },
]

# Static CIDR catalogs (DNS sinkhole / CDN families / probe fallbacks).
# Not kernel ipset and not `bc-nfconf --ipset` (that builds nfqws2 filters
# from the DNS cache). User overlay: ~/.config/blockcheckS/presets/ipset/
# Pin file (auto-pin hosts) lives under XDG data_block, not here.
[ipset]
# dir empty = ~/.config/blockcheckS/presets/ipset then bundled
# dir = "/path/to/custom/ipset"
# Filenames below override which catalog file is loaded (basename, .txt).
sinkhole = "sinkhole.txt"
cgnat = "cgnat.txt"
cdn = [
  "cdn-cloudflare.txt",
  "cdn-google.txt",
  "cdn-fastly.txt",
  "cdn-akamai.txt",
  "cdn-amazon.txt",
  "cdn-discord.txt",
]
expect = "expect.txt"
fallbacks = "fallbacks.txt"

[http]
# Bearer token for the `bs serve` HTTP bridge (--http-port). Required for any
# /api/* route except /api/health. Also read from env BLOCKCHECKS_HTTP_TOKEN.
# token = "change-me"
