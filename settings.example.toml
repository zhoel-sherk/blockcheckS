# blockcheckS user configuration (~/.config/blockcheckS/config.toml)
# Copy to: ~/.config/blockcheckS/config.toml
#
# Priority:
#   [paths]  CLI args > this file > XDG / BLOCKCHECKS_*_HOME defaults
#   [tools]  CLI / env BLOCKCHECKS_* > this file > built-in defaults
# Note: BLOCKCHECKS_STATE_HOME only relocates STATE_DIR defaults; it does not
# override an explicit paths.db / paths.out_dir in this file.

[paths]
db = "~/.local/state/blockcheckS/state.db"
out_dir = "~/.local/share/blockcheckS/export"
# First-run: copy ./state.db → XDG db when XDG db is missing (default on)
migrate = true

[run]
parallel = 4
scan_level = "fast"
# timeout = 5.0
# max = 0
#
# Raspberry Pi 2 / ~1 GiB RAM (prebuild linux-arm nfqws2 elsewhere):
# parallel = 1
# scan_level = "fast"
# Also: --curl-parallel 1, --preset pi2, -M timeout-benchmark, --max 20
# Env: BLOCKCHECKS_POOL=1  (now wired into --parallel default)

[tools]
nfqws2 = "/opt/zapret2/nfq2/nfqws2"
blobs = "/opt/zapret2/blobs"
# lua_dir = "/opt/zapret2/lua"
# python = "/path/to/.venv/bin/python"
# proxy = "socks5://127.0.0.1:11080"

[secure_dns]
# enabled = true
# doh_server = "https://cloudflare-dns.com/dns-query"
