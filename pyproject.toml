[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchecks"
version = "1.4.1"
description = "Asynchronous DPI strategy testing framework for nfqws2/zapret2"
readme = "README.pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "zhoel-sherk"},
]
keywords = ["nfqws2", "zapret", "dpi", "network", "bypass", "blockcheck", "netns"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "curl-cffi>=0.8.0",
    "colorama>=0.4.6",
    "aiosqlite>=0.20.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage = "https://github.com/zhoel-sherk/blockcheckS"
Repository = "https://github.com/zhoel-sherk/blockcheckS"
Changelog = "https://github.com/zhoel-sherk/blockcheckS/blob/master/changelog.md"
Documentation = "https://github.com/zhoel-sherk/blockcheckS/blob/master/docs/guide.md"

[project.scripts]
bs = "blockchecks.bs:main"
bs-mcp = "blockchecks.mcp:main"
bc-nfconf = "blockchecks.nfconf:main"
bc-main = "blockchecks.main:main"

[project.optional-dependencies]
mcp = [
    # MCP bridge (LLM → bs serve daemon). <2.0.0: 2.x dropped
    # mcp.server.fastmcp (FastMCP import location moved).
    "mcp>=1.1.0,<2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # NOTE: pytest-cov omitted — unused in CI/gate (QA-9); do not add a cov job.
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.9.0",
    "vulture>=2.14",
    "pytest-archon>=0.0.6",
    "mutmut>=3.6",
    "hypothesis>=6.0",
]
discovery = ["aiohttp-socks>=0.11.0", "aiohttp>=3.9"]
youtube = ["yt-dlp>=2024.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

# BLOB-1: ship baked data inside the package so a plain `pip install` wheel is
# self-sufficient (no editable install required). data-files are installed on
# the distutils *data* scheme — `sys.prefix[/local]/blockchecks` (or
# `site.getuserbase()/blockchecks` for `pip install --user`) — not inside
# site-packages. config.PROJECT_DIR probes those roots (see engine/config.py).
[tool.setuptools.data-files]
"blockchecks/blobs" = ["blobs/*.bin"]
"blockchecks/configs" = ["configs/*.conf"]
"blockchecks/lua/blockchecks" = ["lua/blockchecks/*.lua"]
"blockchecks/lua/custom" = ["lua/custom/*.lua", "lua/custom/manifest.toml", "lua/custom/README.md"]
"blockchecks/presets/strategies" = ["presets/strategies/*.tls", "presets/strategies/*.txt", "presets/strategies/*.http", "presets/strategies/*.quic", "presets/strategies/*.udp"]
"blockchecks/presets/domains" = ["presets/domains/*.txt"]
"blockchecks/presets/ipset" = ["presets/ipset/*.txt"]
"blockchecks/presets" = ["presets/manifest.toml", "presets/README.md"]
"blockchecks/systemd" = ["systemd/*.service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: no root/netns",
    "integration: needs linux+sudo+nfqws2",
    "slow: long-running",
    "quality: static gates (AST, vulture, mccabe, SIM, archon)",
    "mutation: mutmut survivors gate (slow)",
]
addopts = "-m \"not integration and not quality and not mutation\""

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tmp-scripts", ".cursor-audit", "vulture-whitelist.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C90", # mccabe complexity
    "ARG", # unused arguments
    "RET", # flake8-return (guard clauses; 0 hits on src at add time)
]
ignore = [
    "E501",   # line length — formatter / long CLI strings
    "B008",   # function calls in defaults (argparse)
    "B905",   # zip(strict=) — not worth churn on dict(zip(cols, row))
    "SIM105", # suppress() vs try/except pass — process cleanup prefers explicit
    "SIM102", # nested if — often clearer for DPI status branches
    "SIM108", # ternary preference
    "SIM117", # nested with — test readability
    "UP007",  # keep Optional[X] where already used
]

[tool.ruff.lint.mccabe]
# Live cap 20 (src is green). Quoted C901=7 is 93 hits with current per-file
# ignores. Ratchet 18 → 5 leftover, 15 → 12, 12 → 26.
# Do not enable whole PLR/TRY: quoted 5/8/4/25 + C901=7 = 639 on src.
# Noisy if ever added: PLR2004 (97), PLR0913 (72), TRY003 (50). RET vs PLR0911.
max-complexity = 20

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"src/blockchecks/cli/parser.py" = ["E402"]
"src/blockchecks/engine/async_runner.py" = ["E402"]
"src/blockchecks/engine/byedpi_matrix_generator.py" = ["C901", "ARG"]
"src/blockchecks/engine/generators/*.py" = ["C901", "ARG"]
"src/blockchecks/engine/composite_runner.py" = ["E402"]
"tests/**" = ["ARG"]
"tests/conftest.py" = ["E402", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Quality policy (pytest -m quality reads these) ───────────────────

[tool.blockchecks.ruff_quality]
select = ["SIM", "C90", "ARG", "RET", "B006", "B007", "UP006", "UP007", "UP045"]
# Must restate ignores: CLI --select re-enables codes listed in [tool.ruff.lint].ignore
ignore = ["SIM105", "SIM102", "SIM108", "SIM117", "UP007"]

[tool.blockchecks.ast_quality]
max_nesting = 5
max_elif = 3
nest_exempt_parts = ["/generators/"]
target_dirs = ["src"]
cq016_baseline = 12

[tool.vulture]
paths = ["src/blockchecks", "vulture-whitelist.py"]
min_confidence = 60
ignore_names = [
    "main",
    "visit_*",
    "cmd_*",
    "do_*",
    "kwargs",
]
ignore_decorators = ["@pytest.fixture"]

[tool.mutmut]
# Mutation scope = deterministic ENGINE core only (pure classification / mapping
# / selection / offline validation). I/O-heavy modules (netns, nfqws2 lifecycle,
# lua bridge, sqlite store), checkers with network paths, CLI/TUI and logging
# formatting are intentionally excluded: their mutants mostly encode mocking
# noise instead of business logic. Keep this list small — run batches
# sequentially in CI (workflow_dispatch) rather than on a dev machine.
source_paths = [
    "src/blockchecks/engine/fail_phase.py",
    "src/blockchecks/engine/family_spec.py",
    "src/blockchecks/engine/blob_filter.py",
    "src/blockchecks/engine/tcp_fanout.py",
]
pytest_add_cli_args_test_selection = [
    # NOTE: do NOT pass "-m" here — [tool.pytest.ini_options].addopts already
    # sets `-m "not integration and not quality and not mutation"`.
    # Scoped to tests that cover [tool.mutmut].source_paths (full tests/unit
    # hits unrelated file reads / shims under mutants/ and -x aborts stats).
    "tests/unit/test_fail_phase.py",
    "tests/unit/test_family_spec.py",
    "tests/unit/test_blob_filter.py",
    "tests/unit/test_tcp_fanout.py",
]
pytest_add_cli_args = ["-q"]
# Scoped source_paths copy only those files into mutants/; tests import
# blockchecks from mutants/src and need the rest of the package + data dirs.
also_copy = [
    "src/blockchecks",
    "blobs",
    "configs",
    "presets",
    "lua",
    "scripts",
    "settings.example.toml",
]
do_not_mutate_patterns = ["logger\\.", "raise "]
[tool.blockchecks.architecture]
# ARC-2: in_ns_workers/test_runner live in service (engine→service still allowed).
package = "blockchecks"

[[tool.blockchecks.architecture.rules]]
name = "checkers_no_cli"
match = "blockchecks.checkers*"
should_not_import = ["blockchecks.cli*"]

[[tool.blockchecks.architecture.rules]]
name = "checkers_no_async_runner"
match = "blockchecks.checkers*"
should_not_import = ["blockchecks.engine.async_runner"]

[[tool.blockchecks.architecture.rules]]
name = "store_leaf"
match = "blockchecks.engine.store*"
should_not_import = [
    "blockchecks.cli*",
    "blockchecks.checkers*",
    "blockchecks.bs",
    "blockchecks.main",
]

[[tool.blockchecks.architecture.rules]]
name = "generators_leaf"
match = "blockchecks.engine.generators*"
should_not_import = ["blockchecks.cli*", "blockchecks.checkers*"]

[[tool.blockchecks.architecture.rules]]
name = "engine_no_cli"
match = "blockchecks.engine*"
should_not_import = ["blockchecks.cli*"]

# main.py is the `bs full` orchestrator and owns the argparse tree; it may import cli.

[[tool.blockchecks.architecture.rules]]
name = "service_no_cli"
match = "blockchecks.service*"
should_not_import = ["blockchecks.cli*"]

[[tool.blockchecks.architecture.rules]]
name = "checkers_no_entry"
match = "blockchecks.checkers*"
should_not_import = ["blockchecks.bs", "blockchecks.main"]

[[tool.blockchecks.architecture.rules]]
name = "engine_no_entry"
match = "blockchecks.engine*"
should_not_import = ["blockchecks.bs", "blockchecks.main"]

[[tool.blockchecks.architecture.rules]]
name = "service_no_entry"
match = "blockchecks.service*"
should_not_import = ["blockchecks.bs", "blockchecks.main"]

# ── Dead CLI flags + settings policy ─────────────────────────────────

[tool.blockchecks.dead_flags]
ignore_dests = ["help", "command", "func"]
allow = []
parity_dests = [
    "domain",
    "timeout",
    "parallel",
    "scan_level",
    "secure_dns",
    "doh_server",
    "resume",
    "reprobe_failed",
    "export_limit",
]
# command → source files that must mention each dest (plus shared_readers)
shared_readers = [
    "src/blockchecks/cli/parser.py",
    "src/blockchecks/cli/profiles.py",
    "src/blockchecks/cli/user_config.py",
    "src/blockchecks/engine/preflight.py",
    "src/blockchecks/engine/run_finalize.py",
    "src/blockchecks/engine/run_deadline.py",
    "src/blockchecks/engine/run_spec.py",
    "src/blockchecks/engine/system_deps.py",
    "src/blockchecks/engine/config.py",
    "src/blockchecks/checkers/curl_probe.py",
    "src/blockchecks/checkers/dns_secure.py",
]
[tool.blockchecks.dead_flags.command_readers]
tcp = ["src/blockchecks/cli/commands/tcp.py"]
udp = ["src/blockchecks/cli/commands/udp.py"]
scan = [
    "src/blockchecks/cli/commands/pair.py",
    "src/blockchecks/cli/commands/pair_phases.py",
    "src/blockchecks/cli/parser.py",
]
pair = [
    "src/blockchecks/cli/commands/pair.py",
    "src/blockchecks/cli/commands/pair_phases.py",
    "src/blockchecks/cli/parser.py",
]
composite = ["src/blockchecks/checkers/composite_runner.py", "src/blockchecks/cli/parser.py"]
bench-settle = ["src/blockchecks/cli/commands/bench_settle.py"]
full = ["src/blockchecks/main.py", "src/blockchecks/main_phases.py"]
stop = ["src/blockchecks/cli/commands/stop.py"]
serve = ["src/blockchecks/cli/commands/serve.py", "src/blockchecks/service/server.py", "src/blockchecks/service/probe_service.py"]
preflight = [
    "src/blockchecks/cli/commands/preflight.py",
    "src/blockchecks/cli/cliapp.py",
    "src/blockchecks/cli/parser.py",
]
data-block = ["src/blockchecks/cli/commands/data_block.py"]
harvest-batch = ["src/blockchecks/cli/commands/harvest_batch.py"]
gc = ["src/blockchecks/cli/commands/gc.py"]
mcp = ["src/blockchecks/cli/commands/mcp.py"]

[tool.blockchecks.settings]
env_prefix = "BLOCKCHECKS_"
required_fields = ["nfqws2", "blobs", "pool"]
