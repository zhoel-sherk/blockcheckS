[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchecks"
version = "1.0.0"
description = "Lightspeed DPI strategy tester for zapret2/nfqws2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.8.0",
    "colorama>=0.4.6",
    "aiosqlite>=0.20.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
bs = "blockchecks.bs:main"
bc-nfconf = "blockchecks.nfconf:main"
bc-main = "blockchecks.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
]
discovery = ["aiohttp-socks>=0.11.0", "aiohttp>=3.9"]
youtube = ["yt-dlp>=2024.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

# configs/*.conf and presets/* ship via MANIFEST.in (sdist).
# For wheel installs (pip install .), editable install (-e) is required
# so PROJECT_DIR resolves to the source tree. See docs/package.md (ONB-7).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: no root/netns",
    "integration: needs linux+sudo+nfqws2",
    "slow: long-running",
]
addopts = "-m \"not integration\""

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tmp-scripts", ".cursor-audit"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501",   # line length — formatter / long CLI strings
    "B008",   # function calls in defaults (argparse)
    "B905",   # zip(strict=) — not worth churn on dict(zip(cols, row))
    "SIM105", # suppress() vs try/except pass — process cleanup prefers explicit
    "SIM102", # nested if — often clearer for DPI status branches
    "SIM108", # ternary preference
    "SIM117", # nested with — test readability
    "UP007",  # keep Optional[X] where already used
]

[tool.ruff.lint.per-file-ignores]
"src/blockchecks/cli/parser.py" = ["E402"]
"src/blockchecks/engine/async_runner.py" = ["E402"]
"src/blockchecks/engine/pair_runner.py" = ["E402"]
"src/blockchecks/checkers/composite_runner.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
