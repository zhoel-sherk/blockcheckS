[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchecks"
version = "0.3.0"
description = "Lightspeed DPI strategy tester for zapret2/nfqws2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.8.0",
    "colorama>=0.4.6",
    "aiosqlite>=0.20.0",
]

[project.scripts]
bs = "blockchecks.bs:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
discovery = ["aiohttp-socks>=0.11.0", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockchecks = ["configs/*.conf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: no root/netns",
    "integration: needs linux+sudo+nfqws2",
    "slow: long-running",
]
addopts = "-m \"not integration\""
