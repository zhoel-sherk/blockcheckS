[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchecks"
version = "1.3.0"
description = "Lightspeed DPI strategy tester for zapret2/nfqws2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.8.0",
    "colorama>=0.4.6",
    "aiosqlite>=0.20.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pydantic-settings>=2.0",
    "psutil>=5.9.0",
]

[project.scripts]
bs = "blockchecks.bs:main"
bc-nfconf = "blockchecks.nfconf:main"
bc-main = "blockchecks.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=3.15",
    "ruff>=0.9.0",
    "vulture>=2.14",
    "pytest-archon>=0.0.6",
    "mutmut>=3.6",
]
discovery = ["aiohttp-socks>=0.11.0", "aiohttp>=3.9"]
youtube = ["yt-dlp>=2024.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

# BLOB-1: ship baked data inside the package so a plain `pip install` wheel is
# self-sufficient (no editable install required). data-files land under
# site-packages/blockchecks/{blobs,configs,lua}; config.PROJECT_DIR resolves
# to the package dir when configs/ is present there.
[tool.setuptools.data-files]
"blockchecks/blobs" = ["blobs/*.bin"]
"blockchecks/configs" = ["configs/*.conf"]
"blockchecks/lua/blockchecks" = ["lua/blockchecks/*.lua"]
"blockchecks/presets/strategies" = ["presets/strategies/*.tls", "presets/strategies/*.txt"]
"blockchecks/presets/domains" = ["presets/domains/*.txt"]
"blockchecks/presets/voice" = ["presets/voice/*.txt"]
"blockchecks/systemd" = ["systemd/*.service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: no root/netns",
    "integration: needs linux+sudo+nfqws2",
    "slow: long-running",
    "quality: static gates (AST, vulture, mccabe, SIM, archon)",
    "mutation: mutmut survivors gate (slow)",
]
addopts = "-m \"not integration and not quality and not mutation\" --timeout=90"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tmp-scripts", ".cursor-audit"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C90", # mccabe complexity
    "ARG", # unused arguments
]
ignore = [
    "E501",   # line length — formatter / long CLI strings
    "B008",   # function calls in defaults (argparse)
    "B905",   # zip(strict=) — not worth churn on dict(zip(cols, row))
    "SIM105", # suppress() vs try/except pass — process cleanup prefers explicit
    "SIM102", # nested if — often clearer for DPI status branches
    "SIM108", # ternary preference
    "SIM117", # nested with — test readability
    "UP007",  # keep Optional[X] where already used
]

[tool.ruff.lint.mccabe]
# Soft cap for new code; known hotspots ignored per-file below (ratchet later).
max-complexity = 25

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"src/blockchecks/cli/parser.py" = ["E402"]
"src/blockchecks/engine/async_runner.py" = ["E402"]
"src/blockchecks/engine/byedpi_matrix_generator.py" = ["C901", "ARG"]
"src/blockchecks/engine/generators/*.py" = ["C901", "ARG"]
"src/blockchecks/checkers/composite_runner.py" = ["E402"]
"tests/**" = ["ARG"]
"tests/conftest.py" = ["E402", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── Quality policy (pytest -m quality reads these) ───────────────────

[tool.blockchecks.ruff_quality]
select = ["SIM", "C90", "ARG", "B006", "B007", "UP006", "UP007", "UP045"]
# Must restate ignores: CLI --select re-enables codes listed in [tool.ruff.lint].ignore
ignore = ["SIM105", "SIM102", "SIM108", "SIM117", "UP007"]

[tool.blockchecks.ast_quality]
max_nesting = 5
max_elif = 3
nest_exempt_parts = ["/generators/"]
target_dirs = ["src"]

[tool.vulture]
paths = ["src/blockchecks"]
min_confidence = 80
ignore_names = [
    "main",
    "visit_*",
    "cmd_*",
    "do_*",
    "kwargs",
]
ignore_decorators = ["@pytest.fixture"]

[tool.mutmut]
source_paths = [
    "src/blockchecks/engine/store/sqlite_store.py",
    "src/blockchecks/service/nfqws2_settle.py",
    "src/blockchecks/checkers/dns_secure.py",
    "src/blockchecks/checkers/voice_dns.py",
    "src/blockchecks/engine/results.py",
    "src/blockchecks/engine/nfqws_config.py",
    "src/blockchecks/engine/in_ns_workers.py",
    "src/blockchecks/engine/tcp_fanout.py",
    "src/blockchecks/engine/conf_builder.py",
    "src/blockchecks/checkers/tcp_tls.py",
    "src/blockchecks/checkers/ip_pin.py",
    "src/blockchecks/service/netns_pool.py",
    "src/blockchecks/service/lua_session.py",
    "src/blockchecks/engine/adaptive_queue.py",
    "src/blockchecks/service/batch_bridge_probe.py",
]
pytest_add_cli_args_test_selection = [
    "-m", "unit and not quality and not mutation",
    "tests/unit",
]
pytest_add_cli_args = ["-q"]
do_not_mutate_patterns = ["logger\\.", "raise "]

[tool.blockchecks.architecture]
package = "blockchecks"

[[tool.blockchecks.architecture.rules]]
name = "checkers_no_cli"
match = "blockchecks.checkers*"
should_not_import = ["blockchecks.cli*"]

[[tool.blockchecks.architecture.rules]]
name = "store_leaf"
match = "blockchecks.engine.store*"
should_not_import = [
    "blockchecks.cli*",
    "blockchecks.checkers*",
    "blockchecks.bs",
    "blockchecks.main",
]

[[tool.blockchecks.architecture.rules]]
name = "generators_leaf"
match = "blockchecks.engine.generators*"
should_not_import = ["blockchecks.cli*", "blockchecks.checkers*"]

[[tool.blockchecks.architecture.rules]]
name = "engine_no_cli"
match = "blockchecks.engine*"
should_not_import = ["blockchecks.cli*"]

[[tool.blockchecks.architecture.rules]]
name = "service_no_cli"
match = "blockchecks.service*"
should_not_import = ["blockchecks.cli*"]

[[tool.blockchecks.architecture.rules]]
name = "checkers_no_entry"
match = "blockchecks.checkers*"
should_not_import = ["blockchecks.bs", "blockchecks.main"]

[[tool.blockchecks.architecture.rules]]
name = "engine_no_entry"
match = "blockchecks.engine*"
should_not_import = ["blockchecks.bs", "blockchecks.main"]

[[tool.blockchecks.architecture.rules]]
name = "service_no_entry"
match = "blockchecks.service*"
should_not_import = ["blockchecks.bs", "blockchecks.main"]

# ── Dead CLI flags + settings policy ─────────────────────────────────

[tool.blockchecks.dead_flags]
ignore_dests = ["help", "command", "func"]
allow = []
parity_dests = [
    "domain",
    "timeout",
    "parallel",
    "scan_level",
    "no_secure_dns",
    "doh_server",
    "resume",
    "export_limit",
]
# command → source files that must mention each dest (plus shared_readers)
shared_readers = [
    "src/blockchecks/cli/parser.py",
    "src/blockchecks/cli/user_config.py",
    "src/blockchecks/engine/preflight.py",
    "src/blockchecks/engine/run_finalize.py",
    "src/blockchecks/engine/run_deadline.py",
    "src/blockchecks/engine/system_deps.py",
    "src/blockchecks/engine/config.py",
    "src/blockchecks/checkers/curl_probe.py",
    "src/blockchecks/checkers/dns_secure.py",
]
[tool.blockchecks.dead_flags.command_readers]
tcp = ["src/blockchecks/cli/commands/tcp.py"]
udp = ["src/blockchecks/cli/commands/udp.py"]
scan = [
    "src/blockchecks/cli/commands/pair.py",
    "src/blockchecks/cli/commands/pair_phases.py",
    "src/blockchecks/cli/parser.py",
]
pair = [
    "src/blockchecks/cli/commands/pair.py",
    "src/blockchecks/cli/commands/pair_phases.py",
]
composite = ["src/blockchecks/checkers/composite_runner.py", "src/blockchecks/cli/parser.py"]
bench-settle = ["src/blockchecks/cli/commands/bench_settle.py"]
full = ["src/blockchecks/main.py", "src/blockchecks/main_phases.py"]
stop = ["src/blockchecks/cli/commands/stop.py"]

[tool.blockchecks.settings]
env_prefix = "BLOCKCHECKS_"
required_fields = ["nfqws2", "blobs", "pool"]
