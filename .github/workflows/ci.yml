name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: pytest nfqws2_manager clean plugins
        run: python -m pytest tests/unit/test_nfqws2_manager.py -p no:randomly -p no:cov -p no:xdist -q
      - run: echo "done"
