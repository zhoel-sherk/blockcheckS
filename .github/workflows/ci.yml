name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: pytest matrix_debt_w1 + matrix_generator
        run: python -m pytest tests/unit/test_matrix_debt_w1.py tests/unit/test_matrix_generator.py -q -p no:cacheprovider
      - run: echo "done"
