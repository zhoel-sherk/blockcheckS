name: CI
on:
  pull_request:
jobs:
  s2-full:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: S2 full (with nfqws2_manager)
        run: |
          pytest tests/unit/test_nfqws2_manager.py tests/unit/test_nfqws2_settle.py -q -n auto --dist loadscope --timeout=15
