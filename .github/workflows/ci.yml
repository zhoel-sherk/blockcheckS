name: CI

on:
  push:
    branches: [main, master, alpha]
  pull_request:
    branches: [main, master, alpha]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff Check
        run: ruff check src tests

      - name: Pytest (unit)
        run: pytest -m "not integration and not quality and not mutation" -n auto --dist loadscope --timeout=15

      - name: Quality gates
        run: pytest -m quality --timeout=30

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Mutmut (scoped via pyproject)
        run: |
          mutmut run
          mutmut results

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Integration placeholder
        run: echo "Run scripts/release_smoke.sh on the probe host with sudo"
