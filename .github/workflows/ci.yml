name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: pytest 2nd half
        run: python -m pytest $(ls tests/unit/test_*.py | tail -54) -q -p no:cacheprovider -n 0 -v 2>-q -p no:cacheprovider -n 21 | tail -40
      - run: echo "half2 done"
