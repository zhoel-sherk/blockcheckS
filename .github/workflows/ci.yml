name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: pytest subset (~50% files)
        run: python -m pytest $(ls tests/unit/test_*.py | head -55) -q -p no:cacheprovider -n 2
      - run: echo "subset done"
