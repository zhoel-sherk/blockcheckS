name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - run: echo "install done $(date +%s)"
      - name: pytest full -x --tb=short
        run: python -m pytest -m "not integration and not quality and not mutation" -n 0 -x --tb=short -q
      - run: echo "done $(date +%s)"
