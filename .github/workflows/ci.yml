name: CI
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Pytest (unit + quality)
        run: |
          pytest -m "not integration and not quality and not mutation" -n 2 --dist loadfile
          pytest -m quality -n 2 --dist loadfile
