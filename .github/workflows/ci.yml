name: CI
on:
  pull_request:
jobs:
  s2-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: S2 without nfqws2_manager
        run: |
          pytest tests/unit/test_checkers.py tests/unit/test_composite_runner.py tests/unit/test_curl_probe.py tests/unit/test_curl_repeats.py tests/unit/test_dns_secure.py tests/unit/test_discover_dns_alive.py tests/unit/test_gv_ggc.py tests/unit/test_gv_url.py tests/unit/test_in_ns_workers.py tests/unit/test_ip_block.py tests/unit/test_ip_pin.py tests/unit/test_l3_triage.py tests/unit/test_port_block.py tests/unit/test_preflight.py tests/unit/test_quic_http3.py tests/unit/test_quic_raw.py tests/unit/test_stream_triage.py tests/unit/test_tcp_tls.py tests/unit/test_triage.py tests/unit/test_udp_voice_probes.py tests/unit/test_voice_discovery.py tests/unit/test_voice_dns.py tests/unit/test_batch_bridge_probe.py tests/unit/test_batch_probe.py tests/unit/test_batch_probe_runner.py tests/unit/test_lua_bridge.py tests/unit/test_lua_bridge_edge_cases.py tests/unit/test_lua_bridge_runner.py tests/unit/test_lua_netns.py tests/unit/test_lua_session.py tests/unit/test_netns_pool.py tests/unit/test_nfqws2_settle.py tests/unit/test_firewall_unit.py tests/unit/test_metrics.py tests/unit/test_probe_backend.py tests/unit/test_probe_service.py tests/unit/test_probe_worker.py tests/unit/test_async_runner_methods.py tests/unit/test_async_runner_tcp.py tests/unit/test_batch_scheduler.py -m "not integration and not quality and not mutation" -n auto --dist loadscope --timeout=15
