name: CI
on:
  pull_request:
jobs:
  s2a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: nfqws2_manager only
        run: pytest tests/unit/test_nfqws2_manager.py -q -n auto --dist loadscope --timeout=15
