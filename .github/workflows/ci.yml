name: CI
on:
  pull_request:
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: full file -n 0
        run: pytest tests/unit/test_nfqws2_manager.py -q -n 0
